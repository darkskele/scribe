[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe"
version = "0.1.0"
description = "Takes a module from idea to published design, tracks its work, presents the system as a site, and sets up each piece of coding."
requires-python = ">=3.15"
# The site stack is pinned exactly: sphinx-needs renames its configuration between releases.
dependencies = [
    "sphinx==9.2.0",
    "myst-parser==5.1.0",
    "sphinx-needs==9.2.0",
    "sphinx-design==0.7.0",
    "furo==2025.12.19",
]

[project.scripts]
scribe = "scribe.cli:main"

[tool.setuptools]
packages = ["scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
